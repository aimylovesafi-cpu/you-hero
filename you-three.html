let S,C,R,P,E=[],B=[],score=0,K={x:0,y:0},st=false;
let L=new THREE.TextureLoader();
function SP(u,w,h){let m=new THREE.SpriteMaterial({map:L.load(u),transparent:true});let s=new THREE.Sprite(m);s.scale.set(w,h,1);return s;}
function init(){S=new THREE.Scene();C=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);S.add(new THREE.AmbientLight(0xffffff,1));let dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,5);S.add(dl);let g=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x1a1a35}));g.rotation.x=-1.57;S.add(g);P=new THREE.Group();let sp=SP(TEX,1.5,2.4);sp.position.y=1.2;P.add(sp);P.position.set(0,0,7);S.add(P);C.position.set(0,3.5,8);C.lookAt(P.position);spawn(5);}
function spawn(n){for(let i=0;i<n;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.5,8,8),new THREE.MeshStandardMaterial({color:0x44ff88}));m.position.set((Math.random()-.5)*22,.5,(Math.random()-.5)*22);m.userData={hp:2,s:0.06+Math.random()*.04};E.push(m);S.add(m);}}
function shoot(){if(!st)return;let b=new THREE.Mesh(new THREE.SphereGeometry(.12,6,6),new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0xff00ff,emissiveIntensity:3}));b.position.copy(P.position);b.position.y=1;let d=new THREE.Vector3(0,0,-1);b.userData={v:d.multiplyScalar(.6)};B.push(b);S.add(b);}
function upd(){if(!st)return;P.position.x+=K.x*.18;P.position.z+=K.y*.18;C.position.x+=(P.position.x-C.position.x)*.07;C.position.z+=(P.position.z+6-C.position.z)*.07;C.lookAt(P.position.x,1,P.position.z-2);for(let i=B.length-1;i>=0;i--){let b=B[i];b.position.add(b.userData.v);if(b.position.length()>35){S.remove(b);B.splice(i,1);continue;}for(let j=E.length-1;j>=0;j--){let e=E[j];if(b.position.distanceTo(e.position)<1){S.remove(b);B.splice(i,1);e.userData.hp--;if(e.userData.hp<=0){S.remove(e);E.splice(j,1);score++;sc.textContent=score;if(E.length<2)spawn(3);}break;}}}}E.forEach(e=>{let d=new THREE.Vector3().subVectors(P.position,e.position).normalize().multiplyScalar(e.userData.s);e.position.add(d);});}

const joy=document.getElementById('joy'),stk=document.getElementById('stk');let act=false;function hj(e){let r=joy.getBoundingClientRect();let t=e.touches?e.touches[0]:e;let x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2;let d=Math.sqrt(x*x+y*y),m=34;if(d>m){x=x/d*m;y=y/d*m;}stk.style.transform='translate(calc(-50% + '+x+'px), calc(-50% + '+y+'px))';K.x=x/m;K.y=y/m;}
