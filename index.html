<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YOU HERO - SPACE RAD</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0d0a1a;overflow:hidden;color:#fff;font-family:-apple-system,sans-serif}
#ui{position:fixed;top:0;left:0;width:100%;padding:14px;display:flex;justify-content:space-between;z-index:20;font-weight:900;text-shadow:0 0 10px #ff5bfb}
#joy{position:fixed;left:16px;bottom:20px;width:115px;height:115px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);border-radius:50%;z-index:20}
#stk{position:absolute;left:50%;top:50%;width:44px;height:44px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#fire{position:fixed;right:16px;bottom:20px;width:90px;height:90px;background:linear-gradient(135deg,#ff3bfb,#00e5ff);border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 30px #ff3bfb;font-size:18px}
#start{position:fixed;inset:0;background:radial-gradient(circle at center,#2a1a5a,#070712);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#start img{width:140px;border-radius:18px;margin:14px;box-shadow:0 0 30px #ff5bfb;border:2px solid #ff5bfb}
.btn{background:linear-gradient(90deg,#ff5bfb,#00ffff);padding:16px 40px;border-radius:30px;border:none;font-weight:900;color:#000;font-size:18px}
</style>
</head>
<body>
<div id="ui"><div>SCORE <span id="sc">0</span></div><div>YOU HERO - SPACE RAD</div></div>
<div id="joy"><div id="stk"></div></div>
<div id="fire">FIRE</div>
<div id="start">
  <h1 style="font-size:40px">GRAFFITI HERO</h1>
  <p>خودت اینجایی!</p>
  <img src="./hero.png">
  <button class="btn" id="play">PLAY AS YOU</button>
</div>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,player,enemies=[],bullets=[],score=0,keys={x:0,y:0},started=false;
let loader=new THREE.TextureLoader();
const HERO_URL="./hero.png";

function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x1e1640);
  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1.3));
  let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x1e1640})); ground.rotation.x=-1.57; scene.add(ground);

  player=new THREE.Group();
  let tex=loader.load(HERO_URL);
  let mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, side:2, alphaTest:0.1});
  // حذف بک‌گراند سفید
  mat.onBeforeCompile = s => {
    s.fragmentShader = s.fragmentShader.replace(
      "#include <map_fragment>",
      "#include <map_fragment>\n if(diffuseColor.r>0.92 && diffuseColor.g>0.92 && diffuseColor.b>0.92) discard;\n"
    );
  };
  let mesh=new THREE.Mesh(new THREE.PlaneGeometry(2.2,3.4), mat);
  mesh.position.y=1.7;
  player.add(mesh);
  player.position.set(0,0,8); scene.add(player);
  camera.position.set(0,5,11); camera.lookAt(0,1,0);
  spawn(6);
}
function spawn(n){for(let i=0;i<n;i++){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.6,0),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),0.8,0.6), emissive:new THREE.Color().setHSL(Math.random(),0.8,0.5), emissiveIntensity:0.4})); m.position.set((Math.random()-0.5)*24,0.6,(Math.random()-0.5)*24); m.userData={s:0.05+Math.random()*0.05}; enemies.push(m); scene.add(m);}}
function shoot(){
  let b=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,10),new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0xff00ff,emissiveIntensity:3}));
  b.position.copy(player.position); b.position.y=1.2; b.position.z-=0.5;
  b.userData={v:new THREE.Vector3(0,0,-0.7)}; bullets.push(b); scene.add(b);
}
function update(){
  if(!started) return;
  player.position.x+=keys.x*0.22; player.position.z+=keys.y*0.22;
  player.position.x=Math.max(-12,Math.min(12,player.position.x));
  player.position.z=Math.max(-12,Math.min(12,player.position.z));
  camera.position.x+=(player.position.x-camera.position.x)*0.06;
  camera.position.z+=(player.position.z+11-camera.position.z)*0.06;
  camera.lookAt(player.position.x,1.5,player.position.z);
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i]; b.position.add(b.userData.v);
    if(b.position.length()>50){scene.remove(b); bullets.splice(i,1); continue;}
    for(let j=enemies.length-1;j>=0;j--){
      let e=enemies[j];
      if(b.position.distanceTo(e.position)<1.2){
        scene.remove(b); bullets.splice(i,1); scene.remove(e); enemies.splice(j,1); score++; sc.textContent=score;
        if(enemies.length<3) spawn(5); break;
      }
    }
  }
  enemies.forEach(e=>{let d=new THREE.Vector3().subVectors(player.position,e.position).normalize().multiplyScalar(e.userData.s); e.position.add(d); e.rotation.y+=0.02;});
}
function loop(){requestAnimationFrame(loop); update(); if(renderer) renderer.render(scene,camera);}
const joy=document.getElementById('joy'),stk=document.getElementById('stk'); let act=false;
function hj(e){let r=joy.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; let x=t.clientX-r.left-r.width/2, y=t.clientY-r.top-r.height/2; let d=Math.sqrt(x*x+y*y),m=40; if(d>m){x=x/d*m; y=y/d*m;} stk.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; keys.x=x/m; keys.y=y/m;}
joy.addEventListener('touchstart',e=>{act=true; hj(e);},{passive:false}); joy.addEventListener('touchmove',e=>{if(act) hj(e);},{passive:false}); joy.addEventListener('touchend',()=>{act=false; stk.style.transform='translate(-50%,-50%)'; keys.x=0; keys.y=0;});
fire.addEventListener('touchstart',e=>{e.preventDefault(); shoot();},{passive:false}); fire.addEventListener('click',shoot);
function start(){document.getElementById('start').style.display='none'; started=true; init(); loop();}
play.addEventListener('click',start); play.addEventListener('touchstart',e=>{e.preventDefault(); start();},{passive:false});
</script>
</body>
</html>
