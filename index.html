let scene,camera,renderer,player,enemies=[],bullets=[],score=0,keys={x:0,y:0},started=false;
let loader=new THREE.TextureLoader();
function init(){
  scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1)); let dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(5,10,5); scene.add(dl);
  let ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x1a1a35})); ground.rotation.x=-1.57; scene.add(ground);
  player=new THREE.Group();
  let mat=new THREE.SpriteMaterial({map:loader.load(TEX),transparent:true});
  let spr=new THREE.Sprite(mat); spr.scale.set(1.6,2.6,1); spr.position.y=1.3; player.add(spr);

function spawn(n){for(let i=0;i<n;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(0.5,10,10),new THREE.MeshStandardMaterial({color:0x44ff88})); m.position.set((Math.random()-0.5)*20,0.5,(Math.random()-0.5)*20); m.userData={s:0.06+Math.random()*0.05}; enemies.push(m); scene.add(m);}}
function shoot(){let b=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8),new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0xff00ff,emissiveIntensity:3})); b.position.copy(player.position); b.position.y=1; b.userData={v:new THREE.Vector3(0,0,-0.6)}; bullets.push(b); scene.add(b);}
function update(){
  if(!started) return;
  player.position.x+=keys.x*0.2; player.position.z+=keys.y*0.2;
  camera.position.x+=(player.position.x-camera.position.x)*0.07; camera.position.z+=(player.position.z+6-camera.position.z)*0.07;
  camera.lookAt(player.position.x,1,player.position.z-2);
  for(let i=bullets.length-1;i>=0;i--){let b=bullets[i]; b.position.add(b.userData.v); if(b.position.length()>40){scene.remove(b); bullets.splice(i,1); continue;} for(let j=enemies.length-1;j>=0;j--){let e=enemies[j]; if(b.position.distanceTo(e.position)<1.1){scene.remove(b); bullets.splice(i,1); scene.remove(e); enemies.splice(j,1); score++; sc.textContent=score; if(enemies.length<2) spawn(4); break;}}}
  enemies.forEach(e=>{let d=new THREE.Vector3().subVectors(player.position,e.position).normalize().multiplyScalar(e.userData.s); e.position.add(d);});

const joy=document.getElementById('joy'),stk=document.getElementById('stk'); let act=false;
function hj(e){let r=joy.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; let x=t.clientX-r.left-r.width/2, y=t.clientY-r.top-r.height/2; let d=Math.sqrt(x*x+y*y),m=38; if(d>m){x=x/d*m; y=y/d*m;} stk.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`; keys.x=x/m; keys.y=y/m;}
joy.addEventListener('touchstart',e=>{act=true; hj(e);},{passive:false}); joy.addEventListener('touchmove',e=>{if(act) hj(e);},{passive:false}); joy.addEventListener('touchend',()=>{act=false; stk.style.transform='translate(-50%,-50%)'; keys.x=0; keys.y=0;});
fire.addEventListener('touchstart',e=>{e.preventDefault(); shoot();},{passive:false}); fire.addEventListener('click',shoot);

play.addEventListener('click',start); play.addEventListener('touchstart',e=>{e.preventDefault(); start();},{passive:false});
