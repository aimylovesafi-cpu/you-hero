<meta charset="utf-8">

<title>YOU HERO - Three.js</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#;overflow:hidden;color:#fff;font-family:sans-serif}
#ui{position:fixed;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;z-index:10;font-weight:900}
#joy{position:fixed;left:14px;bottom:14px;width:100px;height:100px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:50%;z-index:10}
#stk{position:absolute;left:50%;top:50%;width:36px;height:36px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#fire{position:fixed;right:14px;bottom:14px;width:82px;height:82px;background:linear-gradient(135deg,#,#);border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #}
#start{position:fixed;inset:0;background:radial-gradient(#,#070712);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.btn{background:linear-gradient(90deg,#,#);padding:13px 32px;border-radius:28px;border:none;font-weight:900;color:#000;margin-top:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui"><div>SCORE <span id="sc">0</span></div><div>YOU HERO - THREE.JS</div></div>
<div id="joy"><div id="stk"></div></div>
<div id="fire">FIRE</div>
<div id="start">
 <h1>GRAFFITI HERO</h1>
 <p>Yourself with a space gun!</p>
 <img id="preview" style="width:120px;border-radius:12px;margin:12px">
 <button class="btn" id="play">PLAY AS YOU</button>
</div>
<script type="module" src="game.js"></script>
</body>
