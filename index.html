<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RUBY - BUG HUNTER AR</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;overflow:hidden}
#ui{position:fixed;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;z-index:20;color:#fff;font-weight:900;text-shadow:0 0 5px #000;background:rgba(0,0,0,.4)}
#ruby{position:fixed;bottom:-20px;left:50%;transform:translateX(-50%);width:300px;z-index:10;pointer-events:none}
#ruby img{width:100%;filter:drop-shadow(0 0 20px #000)}
#cross{position:fixed;width:60px;height:60px;left:50%;top:40%;transform:translate(-50%,-50%);z-index:15;pointer-events:none}
#cross:before,#cross:after{content:'';position:absolute;background:#ff00ff;box-shadow:0 0 10px #ff00ff}
#cross:before{width:2px;height:100%;left:50%;top:0}
#cross:after{height:2px;width:100%;top:50%;left:0}
#cross div{position:absolute;width:20px;height:20px;border:3px solid #00ffff;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #00ffff}
#joy{position:fixed;left:16px;bottom:20px;width:120px;height:120px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);border-radius:50%;z-index:20;backdrop-filter:blur(4px)}
#stk{position:absolute;left:50%;top:50%;width:44px;height:44px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px #fff}
#fire{position:fixed;right:16px;bottom:25px;width:95px;height:95px;background:linear-gradient(135deg,#ff00ff,#00ffff);border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;box-shadow:0 0 25px #ff00ff}
#start{position:fixed;inset:0;background:radial-gradient(circle,#2a1a5a,#000);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.btn{background:linear-gradient(90deg,#ff00ff,#00ffff);padding:18px 44px;border-radius:30px;border:none;font-weight:900;color:#000;font-size:20px;margin-top:14px}
</style>
</head>
<body>
<div id="ui"><div>SCORE <span id="sc">0</span></div><div>RUBY BUG HUNTER</div></div>

<div id="ruby"><img src="./ruby_back.png"></div>
<div id="cross"><div></div></div>

<div id="joy"><div id="stk"></div></div>
<div id="fire">🔫</div>

<div id="start">
  <h1 style="font-size:42px">RUBY AR</h1>
  <p>از پشت - جویستیک = نشونه - دکمه = شلیک</p>
  <img src="./ruby_back.png" style="width:160px;margin:12px;border-radius:14px">
  <button class="btn" id="play">START AR</button>
  <p id="err" style="color:#ff7777;font-size:12px;margin-top:8px"></p>
</div>

<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,videoTex,score=0,enemies=[],bullets=[],started=false;
let aim={x:0,y:-0.1},crossPos={x:0,y:0};
const cross=document.getElementById('cross');

async function startCamera(){
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:"environment"}},audio:false}).catch(()=>navigator.mediaDevices.getUserMedia({video:true}));
  let v=document.createElement('video'); v.autoplay=true; v.playsInline=true; v.muted=true; v.srcObject=stream; await v.play(); return v;
}

function init(vid){
  scene=new THREE.Scene();
  videoTex=new THREE.VideoTexture(vid); videoTex.colorSpace=THREE.SRGBColorSpace;
  scene.background=videoTex;

  camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100);
  camera.position.set(0,1.5,0);
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,1.5));

  spawn(6);
}

function createBug(){
  let g=new THREE.Group();
  let colors=[0xff0000,0x00ff00,0xffff00,0xff8800];
  let body=new THREE.Mesh(new THREE.SphereGeometry(0.18+Math.random()*0.15,8,8), new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*4)], emissive:0x222222}));
  g.add(body);
  for(let i=0;i<2;i++){
    let w=new THREE.Mesh(new THREE.CircleGeometry(0.25,6), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.4, side:2}));
    w.position.set(i?0.2:-0.2,0.05,0); w.rotation.x=1; g.add(w);
  }
  // پاهای ریز
  g.userData={s:0.02+Math.random()*0.04, t:Math.random()*10, hp:1};
  return g;
}
function spawn(n){for(let i=0;i<n;i++){let m=createBug(); m.position.set((Math.random()-0.5)*8, Math.random()*4+1, -4 -Math.random()*8); enemies.push(m); scene.add(m);}}

function shoot(){
  // تیر از پایین وسط به سمت کراس
  let origin=new THREE.Vector3(0,-1,0);
  let target=new THREE.Vector3(aim.x*4, aim.y*3+1.5, -5);
  let dir=new THREE.Vector3().subVectors(target,origin).normalize();

  let b=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), new THREE.MeshBasicMaterial({color:0xffff00}));
  b.position.copy(origin);
  b.userData={v:dir.multiplyScalar(0.35)};
  bullets.push(b); scene.add(b);

  // چک برخورد با Ray
  let ray=new THREE.Raycaster(origin, dir);
  let hits=ray.intersectObjects(enemies,true);
  if(hits.length>0){
    let root=hits[0].object; while(root.parent &&!enemies.includes(root)) root=root.parent;
    if(enemies.includes(root)){
      // بترکون
      let ex=new THREE.Mesh(new THREE.SphereGeometry(0.4,6,6), new THREE.MeshBasicMaterial({color:0xff0000, transparent:true, opacity:0.9}));
      ex.position.copy(root.position); scene.add(ex); setTimeout(()=>scene.remove(ex),120);
      scene.remove(root); enemies.splice(enemies.indexOf(root),1);
      score++; document.getElementById('sc').textContent=score;
      if(enemies.length<4) spawn(3);
    }
  }
}

function update(){
  if(!started) return;
  // جویستیک = حرکت کراس
  aim.x+=crossPos.x*0.08; aim.y+=crossPos.y*0.08;
  aim.x=Math.max(-1.2,Math.min(1.2,aim.x));
  aim.y=Math.max(-0.8,Math.min(1.2,aim.y));
  cross.style.left=(50+aim.x*30)+'%';
  cross.style.top=(40+aim.y*25)+'%';

  bullets.forEach((b,i)=>{
    b.position.add(b.userData.v);
    if(b.position.length()>15){scene.remove(b); bullets.splice(i,1);}
  });
  enemies.forEach(e=>{
    e.position.z+=e.userData.s;
    e.position.x+=Math.sin(e.userData.t)*0.01;
    e.userData.t+=0.15;
    if(e.position.z>1){ e.position.set((Math.random()-0.5)*8, Math.random()*4+1, -10); }
    e.rotation.y+=0.05;
  });
}
function loop(){requestAnimationFrame(loop); update(); if(renderer) renderer.render(scene,camera);}

// کنترل
const joy=document.getElementById('joy'),stk=document.getElementById('stk'); let act=false;
function hj(e){
  let r=joy.getBoundingClientRect(); let t=e.touches?e.touches[0]:e;
  let x=t.clientX-r.left-r.width/2, y=t.clientY-r.top-r.height/2;
  let d=Math.sqrt(x*x+y*y),m=40; if(d>m){x=x/d*m; y=y/d*m;}
  stk.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  crossPos.x=x/m; crossPos.y=y/m;
}
joy.addEventListener('touchstart',e=>{act=true; hj(e)},{passive:false});
joy.addEventListener('touchmove',e=>{if(act) hj(e)},{passive:false});
joy.addEventListener('touchend',()=>{act=false; stk.style.transform='translate(-50%,-50%)'; crossPos.x=0; crossPos.y=0;});
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault(); shoot()},{passive:false});
document.getElementById('fire').addEventListener('click',shoot);

document.getElementById('play').addEventListener('click', async ()=>{
  try{
    let v=await startCamera();
    document.getElementById('start').style.display='none';
    started=true; init(v); loop();
  }catch(err){ document.getElementById('err').textContent=err.message; }
});
</script>
</body>
</html>
